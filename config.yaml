watch:
  enabled: true
  directories:
    - "/Users/joostokkinga/Documents/AutoTranscribe2/recordings"
  include_extensions: [".m4a", ".mp3", ".wav", ".mp4"]
  exclude_patterns: []
  polling_interval_seconds: 10
  output_directory: "/Users/joostokkinga/Documents/AutoTranscribe2/transcripts"
  mirror_source_structure: true

backend:
  type: "parakeet"
  python_executable: "/Users/joostokkinga/Code/AutoTranscribe2/.venv/bin/python"
  script_path: "./py-backend/parakeet_backend.py"
  language_hint: null
  options:
    model_size: "medium"

logging:
  level: "info"
  log_file: "/Users/joostokkinga/Documents/AutoTranscribe2/logs/autotranscribe.log"
  console: true
  verbose_errors: false

title:
  enabled: true
  provider: "ollama" # "ollama" | "heuristic" | "none"
  max_length: 80
  max_words: 5
  language_hint: null
  ollama:
    endpoint: "http://127.0.0.1:11434/api/generate"
    model: "qwen3.5:9b"
    temperature: 0.2
    timeout_ms: 120000

ingest:
  jpr_source_root: "/Users/joostokkinga/Library/Mobile Documents/iCloud~com~openplanetsoftware~just-press-record/Documents"
  recordings_root: "/Users/joostokkinga/Documents/AutoTranscribe2/recordings"

retention:
  enabled: true
  # Newest N recordings always stay in the recordings folder, so a recent one can be
  # re-listened to or re-transcribed if a transcription fails.
  keep_recent_recordings: 3
  # Newest N archived recordings to keep; older ones are deleted permanently.
  # Their transcripts are never deleted. 0 keeps every archived recording.
  keep_archived_recordings: 5
  archive_directory: "/Users/joostokkinga/Documents/AutoTranscribe2/archive"

autostart:
  enabled: true
  label: "com.autotranscribe2.startall"
